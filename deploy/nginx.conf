# Хостовий nginx на VPS — єдина зовнішня точка входу перед Docker-стеком.
# Docker-контейнер client (свій внутрішній nginx) слухає лише 127.0.0.1:8080
# (див. docker-compose.yml), тому весь зовнішній трафік іде через цей конфіг.
#
# Встановлення на сервері:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ytm-player
#   sudo nano /etc/nginx/sites-available/ytm-player   # заміни ТВІЙ-ДОМЕН-АБО-IP
#   sudo ln -s /etc/nginx/sites-available/ytm-player /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (якщо є домен):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d ТВІЙ-ДОМЕН
#   (certbot сам допише 443-блок і редірект з 80 на 443)

server {
    listen 80;
    listen [::]:80;
    server_name ТВІЙ-ДОМЕН-АБО-IP;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
