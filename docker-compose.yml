services:
  server:
    build: ./server
    container_name: ytm-server
    restart: unless-stopped
    environment:
      - PORT=4000
      # Опційно: YTM_COOKIE=... (розкоментуй, якщо потрібні приватні плейлисти
      # без збереження за ID — див. server/.env.example)
    volumes:
      - server-data:/app/data
    ports:
      # Лише localhost — назовні сервер дивитись не повинен, вхід іде через
      # хостовий nginx (deploy/nginx.conf) на client:80.
      - "127.0.0.1:4000:4000"

  client:
    build: ./client
    container_name: ytm-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:8080:80"

volumes:
  server-data:
